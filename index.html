<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MEOWSIC — The Cat Piano</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root { --bg: #0e0a16; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse 120% 80% at 50% 0%, #1c1330 0%, var(--bg) 70%);
    font-family: 'Fredoka', system-ui, sans-serif;
    color: #ffd9f0;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  /* ── Starfield ── */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: .06; } 100% { opacity: var(--o); } }

  /* ── Top bar ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 8px 14px;
    pointer-events: none;
  }
  .logo {
    font-family: 'Caveat', cursive; font-size: clamp(1.4rem, 4.5vw, 2.3rem);
    color: #ffccee; text-shadow: 0 0 22px rgba(255,140,210,.5);
    line-height: 1;
  }
  .hint {
    font-size: clamp(.52rem, 1.5vw, .7rem);
    letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,200,240,.32);
  }
  @media (max-height: 430px) { .hint { display: none; } }
  body.expert .topbar { display: none; }

  /* ── Expert toggle button (top-left) ── */
  .expert-btn {
    position: fixed; top: 10px; left: 12px; z-index: 60;
    display: flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 22px;
    border: 1px solid rgba(255,180,255,.22);
    background: rgba(40,24,58,.9); color: #ffccee;
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: .82rem; letter-spacing: .04em;
    cursor: pointer; backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    transition: transform .15s ease, background .2s;
  }
  .expert-btn:active { transform: scale(.92); }
  body.expert .expert-btn {
    background: rgba(96,42,118,.94);
    border-color: rgba(255,180,255,.42);
  }

  /* ── Song bar (expert mode) ── */
  .songbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 55;
    display: none; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 12px 8px;
    pointer-events: none;
  }
  body.expert .songbar { display: flex; }
  .songbar .row {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    pointer-events: auto;
  }
  .song-btn {
    padding: 8px 14px; border-radius: 20px;
    border: 1px solid rgba(255,180,255,.2);
    background: rgba(36,22,52,.92); color: #ffd9f0;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: .8rem;
    cursor: pointer; white-space: nowrap;
    transition: transform .12s ease, background .2s, box-shadow .2s, opacity .2s;
  }
  .song-btn:active { transform: scale(.93); }
  .song-btn.playing {
    background: linear-gradient(90deg, #f4a7bb, #c4a7e8); color: #2a1233;
    box-shadow: 0 0 22px rgba(230,150,220,.55);
  }
  .song-btn.stop { background: rgba(74,30,42,.92); }
  .now-playing {
    font-family: 'Caveat', cursive; font-size: 1.15rem; color: #ffccee;
    text-shadow: 0 0 14px rgba(255,140,210,.5);
    min-height: 1.25em; pointer-events: none;
  }

  /* ── Stage ── */
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .piano-wrap { transition: transform .45s cubic-bezier(.6,-0.2,.3,1.3); }
  .stage.rotated .piano-wrap { transform: rotate(90deg); }

  .piano-body {
    position: relative;
    width: 400px; height: 260px;
    background: linear-gradient(180deg, #241636 0%, #150d24 100%);
    border-radius: 20px;
    padding: 0;
    border: 2px solid rgba(255,180,255,.08);
    box-shadow:
      0 40px 80px rgba(0,0,0,.7),
      0 0 90px rgba(150,70,200,.12),
      inset 0 2px 0 rgba(255,255,255,.05);
  }
  body.expert .piano-body { border-radius: 10px; }

  .whites { display: flex; height: 100%; width: 100%; }
  .blacks { position: absolute; top: 0; left: 0; right: 0; height: 62%; pointer-events: none; }

  /* ── Keys ── */
  .key {
    position: relative;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .key.white { width: var(--ww); height: 100%; }
  .key.black {
    position: absolute; top: 0;
    width: var(--bw); height: 100%;
    pointer-events: auto;
    z-index: 5;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.65));
  }

  .key .cat {
    width: 100%; height: 100%; display: block;
    transform-origin: 50% 62%;
    transition: transform .07s ease, filter .12s ease;
    will-change: transform;
  }
  .key:hover .cat { filter: brightness(1.08); }
  .key.down .cat { transform: scale(.93) translateY(2.5%); }
  .key.down { filter: drop-shadow(0 0 18px var(--glow)); }
  .key.black.down { filter: drop-shadow(0 0 18px var(--glow)) drop-shadow(0 6px 10px rgba(0,0,0,.6)); }

  .cat .ears { transform-origin: 50% 70%; transition: transform .09s ease; }
  .key.down .cat .ears { transform: translateY(-4px) scale(1.04); }
  .cat .tail-l { transition: transform .25s ease; transform-origin: 80% 90%; }
  .key:hover .cat .tail-l { transform: rotate(-7deg); }
  .key.down .cat .tail-l { transform: rotate(-16deg); }

  .cat .eyes-shut, .cat .mouth-sing { opacity: 0; }
  .key.down .cat .eyes-open, .key.down .cat .mouth-idle { opacity: 0; }
  .key.down .cat .eyes-shut, .key.down .cat .mouth-sing { opacity: 1; }

  /* ── Key label ── */
  .label {
    position: absolute; bottom: 4px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-size: clamp(.5rem, 1.5vw, .72rem);
    font-weight: 600;
    color: rgba(40,20,45,.55);
    letter-spacing: .03em;
  }
  .key.black .label { color: rgba(255,225,250,.4); bottom: 6px; }

  /* ── Meow bubble ── */
  .bubble {
    position: absolute; left: 50%; top: -6px;
    transform: translate(-50%, 0) scale(.5);
    font-family: 'Caveat', cursive; font-size: 1.5rem; font-weight: 700;
    white-space: nowrap; pointer-events: none;
    color: var(--glow); text-shadow: 0 0 12px var(--glow);
    opacity: 0; z-index: 20;
  }
  .key.down .bubble { animation: pop .6s ease-out; }
  body.expert .bubble { display: none; }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, 4px) scale(.4); }
    30%  { opacity: 1; transform: translate(-50%, -22px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -54px) scale(.7); }
  }

  /* ── Floating notes ── */
  .float-note {
    position: fixed; pointer-events: none; z-index: 40;
    font-size: 1.5rem;
    animation: floatAway 1.1s ease-out forwards;
  }
  @keyframes floatAway {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -130px) scale(.3) rotate(var(--rot)); }
  }

  /* ── Rotate button ── */
  .rotate-btn {
    position: fixed; z-index: 35;
    right: 16px; bottom: 16px;
    width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid rgba(255,180,255,.18);
    background: rgba(40,24,58,.85);
    color: #ffccee; font-size: 1.5rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    transition: transform .2s ease, background .2s;
  }
  .rotate-btn:active { transform: scale(.88); background: rgba(60,36,84,.95); }
  .rotate-btn span { transition: transform .45s cubic-bezier(.6,-0.2,.3,1.3); }
  .stage.rotated ~ .rotate-btn span { transform: rotate(90deg); }
  body.expert .rotate-btn { display: none; }

  /* ── Start overlay ── */
  #start {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at 50% 40%, #1c1330, var(--bg));
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    transition: opacity .5s ease;
  }
  #start.hide { opacity: 0; pointer-events: none; }
  #start .big-cat { font-size: 4.5rem; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  #start .title { font-family:'Caveat',cursive; font-size: 3rem; color:#ffccee;
    text-shadow: 0 0 30px rgba(255,140,210,.5); }
  #start .go {
    margin-top: 6px; padding: 13px 30px; border-radius: 30px;
    background: linear-gradient(90deg,#f4a7bb,#c4a7e8);
    color:#2a1233; font-weight: 700; font-size: 1.05rem;
    box-shadow: 0 10px 30px rgba(200,120,220,.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  #start .note { font-size:.72rem; color: rgba(255,200,240,.4); letter-spacing:.08em;
    max-width: 280px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="topbar">
  <span class="logo">🐱 Meowsic</span>
  <span class="hint">tap a kitty &middot; play a tune</span>
</div>

<button class="expert-btn" id="expertBtn">
  <span id="expertIcon">✦</span><span id="expertLabel">Expert</span>
</button>

<div class="songbar" id="songbar">
  <div class="now-playing" id="nowPlaying"></div>
  <div class="row">
    <button class="song-btn" data-song="bumblebee">🐝 Flight of the Bumblebee</button>
    <button class="song-btn" data-song="mountainking">👑 Hall of the Mountain King</button>
    <button class="song-btn stop" id="stopBtn">⏹ Stop</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="piano-wrap">
    <div class="piano-body" id="piano">
      <div class="whites" id="whites"></div>
      <div class="blacks" id="blacks"></div>
    </div>
  </div>
</div>

<button class="rotate-btn" id="rotateBtn" title="Rotate piano" aria-label="Rotate piano"><span>🔄</span></button>

<div id="start">
  <div class="big-cat">🐾</div>
  <div class="title">Meowsic</div>
  <div class="go">tap to wake the kittens</div>
  <div class="note">a piano made of cats — tap ✦ Expert up top for the full self-playing grand</div>
</div>

<script src="/meows.js"></script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════
   MEOWSIC — a cat piano.
   White keys: tabbies (low) grading up to cream / Siamese / white.
   Black keys: black cats, stacked on top between the white keys.
   Audio: 3 real meow voices (low/mid/high) pitch-mapped per note.

   Two modes:
     • Normal — one octave + high C, tap to play.
     • Expert — a full 88-key grand that can play itself
                (Flight of the Bumblebee, Hall of the Mountain King).
   ════════════════════════════════════════════════════════════ */

/* ── Cats ── */
const WHITE_CATS = [
  { name:'Biscuit',     fur:'#9a754f', furDark:'#634930', belly:'#d8b487', ear:'#df9290', eye:'#241c12', nose:'#caa07e', stripes:true,  whisker:'rgba(255,255,255,.82)' },
  { name:'Smokey',      fur:'#9094a0', furDark:'#5d606b', belly:'#c9cbd4', ear:'#dd9a98', eye:'#272430', nose:'#9b9097', stripes:true,  whisker:'rgba(255,255,255,.85)' },
  { name:'Marmalade',   fur:'#e89a55', furDark:'#b1672a', belly:'#f6d2a4', ear:'#ec9d97', eye:'#3a2812', nose:'#d98a6a', stripes:true,  whisker:'rgba(255,255,255,.85)' },
  { name:'Sterling',    fur:'#c2c5cd', furDark:'#8a8d96', belly:'#e8e9ee', ear:'#ecaaa6', eye:'#2a2630', nose:'#b8a8aa', stripes:true,  whisker:'rgba(86,78,92,.6)'   },
  { name:'Custard',     fur:'#ecd5a4', furDark:'#c6a972', belly:'#f8ecd0', ear:'#eeb1aa', eye:'#3a2c14', nose:'#d4ad84', stripes:true,  whisker:'rgba(120,100,80,.55)' },
  { name:'Cloud',       fur:'#f1e4cb', furDark:'#cebd96', belly:'#faf1de', ear:'#f0bdb4', eye:'#2f2618', nose:'#dcb79a', stripes:false, whisker:'rgba(120,105,85,.5)' },
  { name:'Sashimi',     fur:'#efe2c9', furDark:'#c7b48d', belly:'#f8efdb', ear:'#7c5e48', eye:'#3f86d6', nose:'#9c7b63', stripes:false, points:'#6e5140', whisker:'rgba(110,95,80,.5)' },
  { name:'Marshmallow', fur:'#f6f3ee', furDark:'#d3cdc3', belly:'#fdfcf9', ear:'#f2c2bd', eye:'#2c2620', nose:'#e2b6ad', stripes:false, whisker:'rgba(120,110,100,.5)' },
];
const BLACK_CATS = [
  { name:'Shadow',   eye:'#8fe06a' },
  { name:'Pepper',   eye:'#f3c64e' },
  { name:'Midnight', eye:'#6cd9d2' },
  { name:'Binx',     eye:'#f3a64e' },
  { name:'Salem',    eye:'#9b8cf0' },
].map(o => ({
  name:o.name, fur:'#2a2734', furDark:'#141220', belly:'#3b3649',
  ear:'#7a5f70', eye:o.eye, nose:'#5a4a58', stripes:false,
  rim:'rgba(190,178,224,.4)', whisker:'rgba(255,255,255,.85)', isBlack:true,
}));

/* ── Note theory ── */
const PC_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function isBlackPc(pc) { return pc===1 || pc===3 || pc===6 || pc===8 || pc===10; }
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

/* QWERTY key -> NOTE_DEFS index (normal mode, one octave) */
const KEYMAP = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12 };
const KEY_FOR = ['A','W','S','E','D','F','T','G','Y','H','U','J','K'];

/* 3 meow voices — natural fundamental of each recorded cat */
const VOICES = {
  low:  { ref:300 },
  mid:  { ref:400 },
  high: { ref:590 },
};
const BUBBLE = { low:'mrrrow~', mid:'meow!', high:'nyaa~' };
const NOTE_EMOJI = ['♪','♫','♬','🎵','🎶','🐾'];

function pickVoice(freq) {
  let best = 'mid', bd = Infinity;
  for (const k in VOICES) {
    const d = Math.abs(Math.log(freq / VOICES[k].ref));
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}

/* ════════════ Cat artwork (top-down lounging cat, inline SVG) ════════════
   Drawn long & narrow so each cat lounges along a full piano key.        */
function catSVG(c) {
  const dark   = c.furDark;
  const points = c.points || null;          // Siamese-style dark points
  const earOut = points || c.fur;
  const pawCol = points || c.belly;
  const rim    = c.rim
    ? `<rect x="32" y="150" width="136" height="346" rx="66" fill="none" stroke="${c.rim}" stroke-width="3"/>
       <ellipse cx="100" cy="150" rx="81" ry="83" fill="none" stroke="${c.rim}" stroke-width="3"/>`
    : '';
  const mask = points
    ? `<ellipse cx="100" cy="166" rx="66" ry="60" fill="${points}" opacity="0.9"/>`
    : '';
  const stripes = c.stripes
    ? `<g fill="none" stroke="${dark}" stroke-width="12" stroke-linecap="round" opacity="0.42">
         <path d="M56 250 Q100 234 144 250"/>
         <path d="M50 308 Q100 290 150 308"/>
         <path d="M50 366 Q100 348 150 366"/>
         <path d="M52 424 Q100 408 148 424"/>
         <path d="M60 472 Q100 460 140 472"/>
       </g>`
    : '';
  return `
  <svg class="cat" viewBox="0 0 200 520" xmlns="http://www.w3.org/2000/svg">
    <g class="tail-l">
      <path d="M150 476 Q183 448 177 386 Q173 346 146 336"
            fill="none" stroke="${dark}" stroke-width="30" stroke-linecap="round"/>
      <path d="M150 476 Q183 448 177 386 Q173 346 146 336"
            fill="none" stroke="${c.fur}" stroke-width="22" stroke-linecap="round"/>
    </g>
    <rect x="32" y="150" width="136" height="346" rx="66" fill="${c.fur}" stroke="${dark}" stroke-width="5"/>
    <g class="ears">
      <path d="M48 122 L26 26 L104 90 Z"  fill="${earOut}" stroke="${dark}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M152 122 L174 26 L96 90 Z" fill="${earOut}" stroke="${dark}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M54 108 L40 48 L92 88 Z"   fill="${c.ear}"/>
      <path d="M146 108 L160 48 L108 88 Z" fill="${c.ear}"/>
    </g>
    <ellipse cx="100" cy="150" rx="81" ry="83" fill="${c.fur}" stroke="${dark}" stroke-width="5"/>
    <ellipse cx="100" cy="348" rx="52" ry="142" fill="${c.belly}" opacity="0.55"/>
    ${stripes}
    ${mask}
    ${rim}
    <ellipse cx="52"  cy="252" rx="23" ry="30" fill="${pawCol}" stroke="${dark}" stroke-width="4"/>
    <ellipse cx="148" cy="252" rx="23" ry="30" fill="${pawCol}" stroke="${dark}" stroke-width="4"/>
    <ellipse cx="50"  cy="452" rx="30" ry="37" fill="${pawCol}" stroke="${dark}" stroke-width="4"/>
    <ellipse cx="150" cy="452" rx="30" ry="37" fill="${pawCol}" stroke="${dark}" stroke-width="4"/>
    <g class="face">
      <g class="eyes-open">
        <ellipse cx="72" cy="150" rx="12.5" ry="16" fill="${c.eye}"/>
        <ellipse cx="128" cy="150" rx="12.5" ry="16" fill="${c.eye}"/>
        <circle cx="76.5" cy="143" r="4.2" fill="#fff" opacity="0.92"/>
        <circle cx="132.5" cy="143" r="4.2" fill="#fff" opacity="0.92"/>
      </g>
      <g class="eyes-shut">
        <path d="M57 154 Q72 138 87 154"    fill="none" stroke="#2a2030" stroke-width="6" stroke-linecap="round"/>
        <path d="M113 154 Q128 138 143 154" fill="none" stroke="#2a2030" stroke-width="6" stroke-linecap="round"/>
      </g>
      <path d="M90 174 L110 174 L100 186 Z" fill="${c.nose}" stroke="${dark}" stroke-width="2"/>
      <path class="mouth-idle" d="M100 186 Q89 199 78 191 M100 186 Q111 199 122 191"
            fill="none" stroke="#2a2030" stroke-width="4" stroke-linecap="round"/>
      <g class="mouth-sing">
        <ellipse cx="100" cy="200" rx="14"  ry="17" fill="#3a2030"/>
        <ellipse cx="100" cy="207" rx="7.5" ry="9"  fill="${c.nose}"/>
      </g>
      <g stroke="${c.whisker}" stroke-width="2.8" stroke-linecap="round" fill="none">
        <path d="M56 182 Q28 178 8 187"/>
        <path d="M56 196 Q28 200 7 211"/>
        <path d="M144 182 Q172 178 192 187"/>
        <path d="M144 196 Q172 200 193 211"/>
      </g>
    </g>
  </svg>`;
}

/* ════════════ Build the piano ════════════ */
const piano  = document.getElementById('piano');
const whites = document.getElementById('whites');
const blacks = document.getElementById('blacks');
const stage  = document.getElementById('stage');

/* Key ranges (inclusive MIDI note numbers). C4 = 60. */
const RANGE_NORMAL = [60, 72];   // one octave + high C
const RANGE_EXPERT = [21, 108];  // full 88-key piano, A0 → C8

let NOTE_DEFS  = [];             // current keyboard, rebuilt per mode
let keyEls     = [];             // DOM element per NOTE_DEFS index
let whiteCount = 0;
let midiToIdx  = new Map();      // MIDI note -> NOTE_DEFS index
let expert     = false;

function buildNoteDefs(lo, hi) {
  const defs = [];
  let wIdx = 0, bIdx = 0, whitesSoFar = 0;
  for (let m = lo; m <= hi; m++) {
    const pc = m % 12;
    const nd = { midi:m, n:PC_NAMES[pc], oct:Math.floor(m / 12) - 1, f:midiToFreq(m) };
    if (isBlackPc(pc)) { nd.b = bIdx++; nd.before = whitesSoFar; }
    else               { nd.w = wIdx++; whitesSoFar++; }
    defs.push(nd);
  }
  return defs;
}

function buildPiano() {
  const [lo, hi] = expert ? RANGE_EXPERT : RANGE_NORMAL;
  NOTE_DEFS = buildNoteDefs(lo, hi);
  whites.innerHTML = '';
  blacks.innerHTML = '';
  keyEls = [];
  whiteCount = 0;
  midiToIdx.clear();

  const total = NOTE_DEFS.length;
  NOTE_DEFS.forEach((nd, idx) => {
    const isBlack = nd.b !== undefined;
    const cat = isBlack
      ? BLACK_CATS[nd.b % BLACK_CATS.length]
      : WHITE_CATS[nd.w % WHITE_CATS.length];
    const voice = pickVoice(nd.f);
    nd.voice = voice;
    nd.rate  = nd.f / VOICES[voice].ref;
    nd.pan   = (total > 1 ? idx / (total - 1) - 0.5 : 0) * 0.7;
    nd.cat   = cat;

    const el = document.createElement('div');
    el.className = 'key ' + (isBlack ? 'black' : 'white');
    el.dataset.idx = idx;
    el.style.setProperty('--glow', isBlack
      ? 'rgba(190,150,255,.6)'
      : 'rgba(255,190,140,.6)');

    // labels only in normal mode — expert keys are far too narrow for text
    const label = expert
      ? ''
      : `<div class="label">${nd.n}<span style="opacity:.55"> &middot; ${KEY_FOR[idx] || ''}</span></div>`;
    el.innerHTML =
      `<div class="bubble">${BUBBLE[voice]}</div>` +
      catSVG(cat) +
      label;

    if (isBlack) blacks.appendChild(el);
    else { whites.appendChild(el); whiteCount++; }
    keyEls[idx] = el;
    midiToIdx.set(nd.midi, idx);
  });
  layout();
}

/* ════════════ Responsive layout + rotation ════════════ */
let rotated = false;        // is the key row rotated 90° (manual or auto)

const KEY_ASPECT = 2.6;     // white-key height / width — matches the cat viewBox

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;

  // Expert mode always runs the keyboard along the LONGEST screen edge.
  if (expert) rotated = vh > vw;

  // "along" = direction the key row runs; "cross" = key depth direction
  const along = rotated ? vh : vw;
  const cross = rotated ? vw : vh;

  // track length is limited by the screen length AND by key depth fitting the cross axis
  const cap = expert ? 3400 : 1180;
  const trackLen = Math.min(along * 0.99, cross * 0.8 * whiteCount / KEY_ASPECT, cap);
  const ww = trackLen / whiteCount;
  const depth = ww * KEY_ASPECT;
  const bw = ww * 0.62;

  piano.style.width  = trackLen + 'px';
  piano.style.height = depth + 'px';
  piano.style.setProperty('--ww', ww + 'px');
  piano.style.setProperty('--bw', bw + 'px');

  NOTE_DEFS.forEach((nd, idx) => {
    if (nd.b !== undefined) {
      keyEls[idx].style.left = (nd.before * ww - bw / 2) + 'px';
    }
  });
  stage.classList.toggle('rotated', rotated);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

document.getElementById('rotateBtn').addEventListener('click', () => {
  if (expert) return;          // expert rotation is automatic
  rotated = !rotated;
  layout();
});

/* ════════════ Audio ════════════ */
let ctx = null, master = null;
let audioReady = false;
let playbackGain = 1;          // dipped while a song plays itself
const buffers = {};            // voice -> AudioBuffer

function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  master = ctx.createDynamicsCompressor();
  master.threshold.value = -14;
  master.knee.value = 22;
  master.ratio.value = 5;
  master.attack.value = 0.003;
  master.release.value = 0.25;
  master.connect(ctx.destination);

  const meows = window.MEOWS || {};
  await Promise.all(Object.keys(VOICES).map(async (v) => {
    try {
      if (!meows[v]) throw new Error('missing ' + v);
      buffers[v] = await ctx.decodeAudioData(b64ToArrayBuffer(meows[v]));
    } catch (err) {
      console.warn('meow decode failed for', v, '— using synth fallback', err);
      buffers[v] = synthMeow(VOICES[v].ref);
    }
  }));
  audioReady = true;
}

/* Procedural meow — only used if a sample fails to decode */
function synthMeow(baseHz) {
  const sr = ctx.sampleRate, dur = 0.6, len = (sr * dur) | 0;
  const buf = ctx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const t = i / sr;
    const env = Math.exp(-t * 4.2) * Math.min(t * 28, 1);
    const f0 = baseHz * (1.15 - 0.35 * t + 0.12 * Math.sin(t * 11));
    const ph = 2 * Math.PI * f0 * t;
    d[i] = env * 0.4 * (
      0.55 * Math.sin(ph) +
      0.30 * Math.sin(ph * 2.01) +
      0.12 * Math.sin(ph * 3.02) +
      0.06 * Math.sin(ph * 5.03)
    );
  }
  return buf;
}

/* opts: { dur } cuts the meow short (staccato), { gain } scales loudness */
function playNote(nd, opts) {
  if (!audioReady) return;
  if (ctx.state === 'suspended') ctx.resume();

  const buf = buffers[nd.voice];
  if (!buf) return;

  const src = ctx.createBufferSource();
  src.buffer = buf;
  // gentle per-tap detune so repeats aren't robotic
  src.playbackRate.value = nd.rate * (1 + (Math.random() * 2 - 1) * 0.014);

  // light tone shaping keeps every pitch sounding cat-like, not buzzy
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 130;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 8200;

  const gain = ctx.createGain();
  // tame the loud high voice a touch so the keyboard stays even
  let g = 0.92 - Math.max(0, nd.rate - 1) * 0.22;
  g *= playbackGain;
  if (opts && opts.gain !== undefined) g *= opts.gain;
  gain.gain.value = g;

  let out = gain;
  if (ctx.createStereoPanner) {
    const pan = ctx.createStereoPanner();
    pan.pan.value = nd.pan;
    gain.connect(pan);
    out = pan;
  }
  src.connect(hp); hp.connect(lp); lp.connect(gain);
  out.connect(master);
  src.start(0);

  // staccato: fade the meow out early so fast runs don't smear
  if (opts && opts.dur) {
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(g, t + opts.dur);
    gain.gain.linearRampToValueAtTime(0.0001, t + opts.dur + 0.06);
    try { src.stop(t + opts.dur + 0.09); } catch (e) {}
  }
}

/* ════════════ Trigger (sound + animation) ════════════ */
let lastFloat = 0;

function trigger(idx, opts) {
  const nd = NOTE_DEFS[idx];
  const el = keyEls[idx];
  if (!nd || !el) return;
  playNote(nd, opts);
  el.classList.remove('down');
  void el.offsetWidth;            // restart CSS animation
  el.classList.add('down');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('down'), 420);
  spawnNote(el);
}

function triggerMidi(m, opts) {
  const idx = midiToIdx.get(m);
  if (idx !== undefined) trigger(idx, opts);
}

function spawnNote(el) {
  // rate-limit during blistering self-play so the DOM stays light
  const now = performance.now();
  if (now - lastFloat < 55) return;
  lastFloat = now;

  const r = el.getBoundingClientRect();
  const n = document.createElement('div');
  n.className = 'float-note';
  n.textContent = NOTE_EMOJI[(Math.random() * NOTE_EMOJI.length) | 0];
  n.style.left = (r.left + r.width / 2) + 'px';
  n.style.top  = (r.top + r.height * 0.3) + 'px';
  n.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
  n.style.setProperty('--rot', (Math.random() * 70 - 35) + 'deg');
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}

/* ════════════ Pointer input (multi-touch + glissando) ════════════ */
const pointerKey = new Map();   // pointerId -> last idx played

function keyIdxAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const k = el && el.closest && el.closest('.key');
  return k ? +k.dataset.idx : -1;
}

piano.addEventListener('pointerdown', (e) => {
  const idx = keyIdxAt(e.clientX, e.clientY);
  if (idx < 0) return;
  e.preventDefault();
  pointerKey.set(e.pointerId, idx);
  trigger(idx);
}, { passive: false });

piano.addEventListener('pointermove', (e) => {
  if (!pointerKey.has(e.pointerId)) return;
  const idx = keyIdxAt(e.clientX, e.clientY);
  if (idx >= 0 && idx !== pointerKey.get(e.pointerId)) {
    pointerKey.set(e.pointerId, idx);
    trigger(idx);            // slide across keys = glissando
  }
}, { passive: false });

function endPointer(e) { pointerKey.delete(e.pointerId); }
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

/* ── Keyboard (normal mode only) ── */
const held = new Set();
window.addEventListener('keydown', (e) => {
  if (expert) return;
  const k = e.key.toLowerCase();
  if (k in KEYMAP && !held.has(k)) {
    held.add(k);
    trigger(KEYMAP[k]);
  }
});
window.addEventListener('keyup', (e) => held.delete(e.key.toLowerCase()));

/* ════════════════════════════════════════════════════════════
   SELF-PLAYING PIANO — public-domain showpieces
   ════════════════════════════════════════════════════════════ */

/* Flight of the Bumblebee — Rimsky-Korsakov (1899/1900, public domain).
   Perpetual-motion chromatic 16ths: cascading semitone runs that weave
   down and back up the keyboard, then a buzzing climb to the high C. */
function genBumblebee() {
  const seq = [];
  const run = (a, b) => {            // inclusive chromatic run, either direction
    const s = a < b ? 1 : -1;
    for (let m = a; m !== b + s; m += s) seq.push(m);
  };
  run(84, 72); run(72, 79); run(79, 72); run(72, 84);
  run(84, 71); run(71, 78); run(78, 67); run(67, 79);
  run(79, 68); run(68, 80); run(80, 69); run(69, 84);
  run(84, 72); run(72, 84);

  const dt = 0.092;                  // ~11 notes/sec — frantic but clean
  const out = [];
  let t = 0;
  for (const m of seq) { out.push({ midi:m, t, dur:0.15 }); t += dt; }
  out.push({ midi:84, t: t + 0.05, dur:0.7, gain:1.15 });   // the bee lands
  return out;
}

/* In the Hall of the Mountain King — Grieg, Peer Gynt (1875, public domain).
   The creeping theme played three times — low, middle, high octave — with
   a steady accelerando, the way the troll hall scene speeds up. */
function genMountainKing() {
  // semitone offsets from C4; the theme as a letter-note sequence
  const THEME = [0,2,4,0,4,3,3,2,2,0,2,4,0,4,-3,-5,4,0,4,7,
                 0,2,4,0,4,3,3,2,2,0,2,4,0,4,7,4,2];
  const BASE = 60;
  const OCTAVES = [-12, 0, 12];
  const total = THEME.length * OCTAVES.length;
  const out = [];
  let t = 0, i = 0;
  for (const oct of OCTAVES) {
    for (const off of THEME) {
      const step = 0.30 - (i / total) * 0.20;          // 0.30s → 0.10s
      out.push({ midi: BASE + oct + off, t, dur: Math.max(0.16, step * 0.9) });
      t += step;
      i++;
    }
  }
  // a final ringing low/mid/high tonic cluster
  out.push({ midi: BASE - 12, t, dur:1.0 });
  out.push({ midi: BASE,      t, dur:1.0 });
  out.push({ midi: BASE + 12, t, dur:1.0, gain:1.1 });
  return out;
}

const SONGS = {
  bumblebee:    { title:'Flight of the Bumblebee', gain:0.62, gen:genBumblebee },
  mountainking: { title:'In the Hall of the Mountain King', gain:0.6, gen:genMountainKing },
};

/* ── Playback engine ── */
let songTimers = [];
let playing = false;
let playingKey = null;

const nowPlayingEl = document.getElementById('nowPlaying');
const stopBtn = document.getElementById('stopBtn');

function updateSongUI() {
  document.querySelectorAll('.song-btn[data-song]').forEach((b) => {
    b.classList.toggle('playing', playing && b.dataset.song === playingKey);
  });
  nowPlayingEl.textContent = playing ? '♫ ' + SONGS[playingKey].title + ' ♫' : '';
  stopBtn.style.opacity = playing ? 1 : 0.45;
}

function stopSong() {
  songTimers.forEach(clearTimeout);
  songTimers = [];
  if (playing) {
    playing = false;
    playingKey = null;
    playbackGain = 1;
    updateSongUI();
  }
}

function playSong(key) {
  if (!expert || !audioReady) return;
  const def = SONGS[key];
  if (!def) return;
  stopSong();

  const events = def.gen();
  playing = true;
  playingKey = key;
  playbackGain = def.gain;
  updateSongUI();

  let end = 0;
  for (const ev of events) {
    end = Math.max(end, ev.t + (ev.dur || 0));
    songTimers.push(setTimeout(
      () => triggerMidi(ev.midi, { dur: ev.dur, gain: ev.gain }),
      ev.t * 1000));
  }
  songTimers.push(setTimeout(stopSong, end * 1000 + 900));
}

document.querySelectorAll('.song-btn[data-song]').forEach((b) => {
  b.addEventListener('click', () => {
    if (playing && playingKey === b.dataset.song) stopSong();
    else playSong(b.dataset.song);
  });
});
stopBtn.addEventListener('click', stopSong);

/* ════════════ Expert mode (full grand + fullscreen landscape) ════════════ */
const expertBtn   = document.getElementById('expertBtn');
const expertIcon  = document.getElementById('expertIcon');
const expertLabel = document.getElementById('expertLabel');

function goFullscreenLandscape() {
  const de = document.documentElement;
  const req = de.requestFullscreen || de.webkitRequestFullscreen;
  const lock = () => {
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } catch (e) {}
  };
  let p = null;
  try { if (req) p = req.call(de); } catch (e) { p = null; }
  if (p && p.then) p.then(lock, lock);
  else lock();
}

function exitFullscreen() {
  try {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  } catch (e) {}
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
    try { exit.call(document); } catch (e) {}
  }
}

function updateExpertUI() {
  document.body.classList.toggle('expert', expert);
  expertIcon.textContent  = expert ? '✕' : '✦';
  expertLabel.textContent = expert ? 'Exit' : 'Expert';
}

function enterExpert() {
  if (expert) return;
  expert = true;
  updateExpertUI();
  buildPiano();
  goFullscreenLandscape();
}

function exitExpert() {
  if (!expert) return;
  stopSong();
  expert = false;
  rotated = false;
  updateExpertUI();
  exitFullscreen();
  buildPiano();
}

expertBtn.addEventListener('click', () => {
  if (!audioReady) initAudio();      // in case expert is the first thing tapped
  expert ? exitExpert() : enterExpert();
});

/* ════════════ Starfield ════════════ */
const starsEl = document.getElementById('stars');
const starFrag = document.createDocumentFragment();
for (let i = 0; i < 55; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top  = Math.random() * 100 + '%';
  s.style.setProperty('--dur', (1.6 + Math.random() * 4) + 's');
  s.style.setProperty('--o', (0.25 + Math.random() * 0.7).toFixed(2));
  s.style.animationDelay = Math.random() * 3 + 's';
  starFrag.appendChild(s);
}
starsEl.appendChild(starFrag);

/* ════════════ Boot ════════════ */
buildPiano();          // normal mode keyboard

const startEl = document.getElementById('start');
function begin() {
  startEl.removeEventListener('pointerdown', begin);
  initAudio();
  startEl.classList.add('hide');
  setTimeout(() => startEl.remove(), 600);
}
startEl.addEventListener('pointerdown', begin);
window.addEventListener('keydown', begin, { once: true });
</script>
</body>
